# Automatically redeploy the Render service on every push to this branch.
#
# Setup (one-time, takes ~2 minutes):
#
#   1. In Render Dashboard → your datumprikker service → Settings
#      → Build & Deploy → Deploy Hook → click "Generate" → copy the URL.
#   2. In GitHub → this repo → Settings → Secrets and variables → Actions
#      → New repository secret → name: RENDER_DEPLOY_HOOK_URL → paste the URL.
#
# After that every `git push` to this branch triggers an automatic Render deploy.

name: Deploy to Render

on:
  push:
    branches:
      # TODO: after this PR is merged to main, change this to 'main'
      - copilot/add-interview-scheduling-mechanism

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    permissions: {}   # no GitHub token access needed — only curl to Render
    steps:
      - name: Call Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret is not set — skipping auto-deploy."
            echo "   Follow the setup steps in README.md → Option A → Auto-deploy on every push."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Render deploy triggered successfully."
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
