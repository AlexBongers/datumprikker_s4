# Fly.io deployment configuration
# https://fly.io/docs/
#
# Deploy steps:
#   1. Install flyctl:  curl -L https://fly.io/install.sh | sh
#   2. Sign up / log in:  fly auth signup   (or fly auth login)
#   3. From the repo root:
#        fly launch --no-deploy   # creates the app and volume
#        fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
#        fly deploy
#   4. After the first deploy, get your app URL and set BASE_URL:
#        fly secrets set BASE_URL=https://<your-app-name>.fly.dev
#
# Fly.io free tier includes 3 VMs and 3 GB of persistent volume storage.

app = "datumprikker"        # change to your chosen app name (must be globally unique)
primary_region = "ams"      # Amsterdam — closest to the Netherlands

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for the SQLite database.
# Created automatically by `fly launch` or manually with:
#   fly volumes create datumprikker_data --size 1 --region ams
[[mounts]]
  source = "datumprikker_data"
  destination = "/data"
